# La web son archivos estaticos: no hay nada que compilar. Solo se copian a
# _site, dejando fuera lo que no debe verse en la web (como hace .assetsignore
# en Cloudflare). Los encabezados de cache los sigue poniendo _headers, que
# Netlify entiende con la misma sintaxis que usaba Cloudflare.
[build]
  command = "mkdir -p _site && rsync -a --exclude-from=.assetsignore --exclude=_site --exclude=netlify.toml --exclude=.git ./ _site/"
  publish = "_site"

# Sin esto, /inscripcion (sin barra final) no encontraria la ficha.
[[redirects]]
  from = "/inscripcion"
  to = "/inscripcion/"
  status = 301
  force = false
